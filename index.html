<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace("http://localhost:8000/index.html");
      }
    </script>
    <title>DRMC 4x4 Interactive Display</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <link
      href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      button,
      input,
      select,
      option,
      textarea,
      .maplibregl-popup,
      .maplibregl-popup-content,
      .maplibregl-ctrl,
      .maplibregl-ctrl button {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important;
      }
      body {
        margin: 0;
        padding: 0;
        background: #010208;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #map-status {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        max-width: 420px;
        padding: 20px;
        background: white;
        color: #222;
        border-radius: 8px;
        box-shadow: 0 2px 16px #0003;
        font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #map-status[hidden] {
        display: none;
      }
      /* map styles below */
      #map {
        width: 100vw;
        height: 100vh;
        background-color: #010208;
        background-image:
          radial-gradient(circle at 18% 24%, #ffffffcc 0 1px, transparent 1.4px),
          radial-gradient(circle at 72% 16%, #a9c7ff99 0 1px, transparent 1.3px),
          radial-gradient(circle at 42% 78%, #ffffff99 0 1px, transparent 1.2px),
          radial-gradient(circle at 88% 64%, #ffffffaa 0 1px, transparent 1.4px);
        background-size: 210px 190px, 280px 230px, 170px 240px, 320px 270px;
      }
      .maplibregl-canvas {
        cursor: grab;
      }
      .maplibregl-canvas:active {
        cursor: grabbing;
      }
      /* transparency slider styles below */
      .map-overlay {
        position: absolute;
        width: 20%;
        top: 15px;
        right: 40px;
        padding: 5px;
        font-size: 14px;
        cursor: url("cursor.png"), pointer;
      }
      .map-overlay .map-overlay-inner {
        background-color: #faf8f8;
        color: #0d0505;
        opacity: 1;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        border-radius: 3px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .map-overlay input {
        background-color: transparent;
        display: inline-block;
        width: 100%;
        position: relative;
        margin: 0;
        cursor: grab;
      }
      /* reset button styles below */
      .reset-button {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #fbf8f8;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 14px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        z-index: 1;
        cursor: url("cursor.png");
      }
      .reset-button:hover {
        background: #fbf8f8;
        cursor: url("cursor.png"), pointer;
      }
      .rotation-button {
        position: absolute;
        top: 48px;
        left: 10px;
        z-index: 1;
        min-width: 112px;
        padding: 7px 10px;
        border: none;
        border-radius: 4px;
        background: #fbf8f8;
        color: #0d0505;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        cursor: pointer;
      }
      .rotation-button:hover {
        background: #ececec;
      }
      .clear-map-button {
        position: absolute;
        top: 86px;
        left: 10px;
        z-index: 1;
        min-width: 112px;
        padding: 7px 10px;
        border: none;
        border-radius: 3px;
        background: #fbf8f8;
        color: #0d0505;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        cursor: pointer;
      }
      .clear-map-button:hover {
        background: #ececec;
      }
      .zoom-slider-control {
        position: absolute;
        top: 95px;
        right: 8px;
        z-index: 3;
        display: flex;
        width: 34px;
        align-items: center;
        flex-direction: column;
        border: 1px solid #aaa;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .zoom-slider-control button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        background: white;
        color: #222;
        font-size: 22px;
        line-height: 30px;
        cursor: pointer;
      }
      .zoom-slider-control button:hover {
        background: #eee;
      }
      .zoom-slider-control input[type="range"] {
        width: 22px;
        height: 132px;
        margin: 5px 0;
        padding: 0;
        accent-color: #666;
        appearance: slider-vertical;
        -webkit-appearance: slider-vertical;
        writing-mode: vertical-lr;
        direction: rtl;
        touch-action: none;
        cursor: ns-resize;
      }
      .basemap-control {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: calc(100% - 40px);
        color: #0d0505;
        font: 14px "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .basemap-control select {
        width: 100%;
        padding: 7px;
        font: inherit;
      }
      .terrain-control {
        width: calc(100% - 40px);
        color: #0d0505;
        font: 14px "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .compass-dial {
        position: absolute;
        right: 10px;
        bottom: 42px;
        z-index: 2;
        width: 90px;
        height: 90px;
        border: 3px solid #333;
        border-radius: 50%;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
        touch-action: none;
        user-select: none;
      }
      .north-node {
        position: absolute;
        display: flex;
        width: 24px;
        height: 24px;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        border: 2px solid white;
        border-radius: 50%;
        background: #b5121b;
        color: white;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        font: bold 13px "Helvetica Neue", Helvetica, Arial, sans-serif;
        cursor: grab;
        touch-action: none;
      }
      .north-node:active {
        cursor: grabbing;
      }
      .tilt-control {
        position: absolute;
        right: 20px;
        bottom: 150px;
        z-index: 2;
        width: 70px;
        height: 105px;
        border: 3px solid #1769aa;
        border-radius: 18px;
        box-sizing: border-box;
        background: rgba(239, 248, 255, 0.95);
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
        color: #0d4f84;
        touch-action: none;
        user-select: none;
      }
      .tilt-label {
        display: block;
        margin-top: 5px;
        text-align: center;
        font: bold 10px "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: 0.08em;
      }
      .tilt-track {
        position: absolute;
        top: 27px;
        bottom: 9px;
        left: 50%;
        width: 4px;
        transform: translateX(-50%);
        border-radius: 4px;
        background: #9bc8e8;
      }
      .tilt-handle {
        position: absolute;
        left: 50%;
        display: flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        border: 2px solid white;
        border-radius: 50%;
        background: #1769aa;
        color: white;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        cursor: ns-resize;
        font: bold 17px "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      /* Historical-map navigation menu */
      .story-map-select {
        display: block;
        position: absolute;
        width: 20%;
        height: 40px;
        top: 95px;
        right: 45px;
        padding: 5px;
        border: none;
        border-radius: 3px;
        font-size: 14px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        text-align: center;
        color: #0d0505;
        background: #fbf8f8;
      }
      .historical-map-picker,
      .stairwell-map-picker {
        position: absolute;
        right: 45px;
        z-index: 4;
        width: 20%;
      }
      .historical-map-picker {
        top: 95px;
        z-index: 5;
      }
      .stairwell-map-picker {
        top: 140px;
      }
      .historical-map-picker summary,
      .stairwell-map-picker summary {
        box-sizing: border-box;
        display: flex;
        width: 100%;
        height: 40px;
        align-items: center;
        justify-content: center;
        padding: 5px 26px 5px 8px;
        overflow: hidden;
        border-radius: 3px;
        border-left: 6px solid #008c95;
        background: #fbf8f8;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        color: #0d0505;
        cursor: pointer;
        font-size: 14px;
        list-style: none;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .historical-map-picker summary {
        border-left: 6px solid #b5121b;
      }
      .historical-map-picker summary::-webkit-details-marker,
      .stairwell-map-picker summary::-webkit-details-marker {
        display: none;
      }
      .historical-map-picker summary::after,
      .stairwell-map-picker summary::after {
        content: "▾";
        position: absolute;
        right: 10px;
      }
      .historical-map-picker summary::after {
        color: #8e0e16;
      }
      .stairwell-map-picker summary::after {
        color: #006c74;
      }
      .historical-map-picker[open] summary::after,
      .stairwell-map-picker[open] summary::after {
        content: "▴";
      }
      .historical-map-picker summary:hover {
        background: #fff1f2;
      }
      .stairwell-map-picker summary:hover {
        background: #edfafa;
      }
      .historical-map-menu,
      .stairwell-map-menu {
        position: absolute;
        top: 44px;
        right: 0;
        box-sizing: border-box;
        display: grid;
        width: min(390px, calc(100vw - 70px));
        max-height: min(620px, calc(100vh - 205px));
        gap: 7px;
        padding: 9px;
        overflow-y: auto;
        border: 1px solid #b7d4d6;
        border-radius: 5px;
        background: rgba(250, 255, 255, 0.98);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.32);
      }
      .historical-map-menu {
        border-color: #dfb8bb;
        background: rgba(255, 251, 251, 0.98);
      }
      .map-menu-section {
        margin: 4px 3px 0;
        color: #6f0710;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .historical-map-option,
      .stairwell-map-option {
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        gap: 10px;
        min-height: 74px;
        padding: 6px;
        border: 1px solid #d5e5e6;
        border-radius: 4px;
        background: white;
        color: #152628;
        cursor: pointer;
        font: 13px/1.25 "Helvetica Neue", Helvetica, Arial, sans-serif;
        text-align: left;
      }
      .historical-map-option {
        border-color: #ead7d9;
        color: #2c1719;
      }
      .historical-map-option:hover,
      .historical-map-option:focus-visible {
        border-color: #b5121b;
        background: #fff0f1;
        outline: none;
      }
      .stairwell-map-option:hover,
      .stairwell-map-option:focus-visible {
        border-color: #008c95;
        background: #eaf8f8;
        outline: none;
      }
      .historical-map-option img,
      .stairwell-map-option img {
        width: 104px;
        height: 70px;
        border-radius: 3px;
        object-fit: cover;
        background: #dde7e7;
      }
      .historical-map-option strong,
      .historical-map-option small,
      .stairwell-map-option strong,
      .stairwell-map-option small {
        display: block;
      }
      .historical-map-option small,
      .stairwell-map-option small {
        margin-top: 5px;
        color: #586567;
      }
      .story-map-select {
        top: 185px;
        border-left: 6px solid #6f42c1;
      }
      .story-map-select:hover {
        background: #f5f0ff;
        cursor: pointer;
      }
      .pin-details {
        max-width: 350px;
        color: #171717;
        font: 13px/1.42 "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .pin-details h3 {
        margin: 0 22px 8px 0;
        color: #111;
        font-size: 17px;
        line-height: 1.2;
      }
      .pin-details dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 8px;
        margin: 0 0 8px;
      }
      .pin-details dt {
        font-weight: bold;
      }
      .pin-details dd {
        margin: 0;
      }
      .pin-details p {
        margin: 7px 0;
      }
      .pin-details a {
        color: #4c2c91;
        font-weight: bold;
      }
      .pin-details img {
        display: block;
        width: 100%;
        max-height: 430px;
        margin: 8px 0 10px;
        border-radius: 4px;
        object-fit: contain;
        background: #eee;
      }
      .pin-details .preview-note {
        display: block;
        margin: -4px 0 9px;
        color: #596466;
        font-size: 11px;
        text-align: center;
      }
      .pin-details details {
        margin: 9px 0;
      }
      .pin-details details a {
        display: block;
        margin: 4px 0;
      }
      .pin-details .catalog-metadata {
        max-height: 280px;
        overflow: auto;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fafafa;
      }
      /* Add menu side bar*/
      .rounded-rect {
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 50px -25px black;
      }
      .flex-center {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .flex-center.left {
        left: 0px;
      }
      .flex-center.right {
        right: 0px;
      }
      .sidebar-content {
        position: absolute;
        width: 95%;
        height: 95%;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: gray;
        flex-direction: column;
        gap: 12px;
      }
      .sidebar-toggle {
        position: absolute;
        width: 3em;
        height: 4em;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 16px;
      }
      .sidebar-toggle.right {
        left: -3.8em;
      }
      .sidebar-toggle:hover {
        cursor: pointer;
        color: #0aa1cf;
      }
      .sidebar {
        transition: transform 1.2s;
        z-index: 1;
        width: 300px;
        height: 100%;
      }
      .right.collapsed {
        transform: translateX(295px);
      }
    </style>
  </head>

  <body>

    </div>
    <!-- Add the map container -->

      <!-- Add the menu sidebar -->

          <strong>Map Options</strong>
          <label class="basemap-control" for="basemap-select">

    <script>
      let mapHasLoaded = false;

      function showMapError(message) {
        const status = document.getElementById("map-status");
        status.textContent = "The map could not load: " + message;
        status.hidden = false;
      }
      window.addEventListener("error", (event) => {
        if (!mapHasLoaded && event.message && event.message !== "Script error.") {
          showMapError(event.message);
        }
      });
      window.addEventListener("unhandledrejection", (event) => {
        if (!mapHasLoaded) {
          showMapError(event.reason?.message || String(event.reason));
        }
      });
    </script>
    <script src="./rumsey-maps.js?v=20261014-3"></script>
    <script src="./rumsey-preview-index.js?v=20261014-3"></script>
    <script src="./rumsey-georeferencer.js"></script>
    <script src="./stairwell-maps.js"></script>
    <script type="module">
      let maplibregl;
      try {
        maplibregl = await import(
          "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs"
        );
      } catch (error) {
        showMapError(
          "The map library could not be downloaded. Check your internet connection.",
        );
        throw error;
      }

      // Base Map Initialization
      const initialState = {
        center: [30, 15],
        zoom: 3,
        bearing: 0,
        pitch: 0,
      };
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
          projection: {
            type: "globe",
          },
          sources: {
            openstreetmap: {
              type: "raster",

      function useZoomControl(targetZoom, animate = true) {
        spinEnabled = false;
        userInteracting = true;
        updateRotationButton();
        const zoom = Math.min(18, Math.max(0, targetZoom));
        map.stop();
        if (animate) {
          map.easeTo({ zoom, duration: 250 });
        } else {
          map.setZoom(zoom);
        }
      }

      zoomSlider.addEventListener("input", (event) => {

      // Google Earth-style orientation gestures. Trackpads emit small pixel
      // wheel deltas for two-finger swipes; mouse wheels emit larger steps.
      const mapCanvasContainer = map.getCanvasContainer();
      mapCanvasContainer.addEventListener(
        "wheel",
        (event) => {
          const looksLikeTrackpad =
            !event.ctrlKey &&
            event.deltaMode === WheelEvent.DOM_DELTA_PIXEL &&
            (Math.abs(event.deltaX) > 0 || Math.abs(event.deltaY) < 50);
          if (!looksLikeTrackpad) return;

          event.preventDefault();
          event.stopImmediatePropagation();
          spinEnabled = false;
          updateRotationButton();
          map.jumpTo({
            bearing: map.getBearing() + event.deltaX * 0.25,
            pitch: Math.min(
              75,
              Math.max(0, map.getPitch() + event.deltaY * 0.15),
            ),
          });
        },
        { capture: true, passive: false },
      );

      let middleMouseDragging = false;
      let middleMouseX = 0;
      let middleMouseY = 0;
      mapCanvasContainer.addEventListener(
        "mousedown",
        (event) => {
          if (event.button !== 1) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          middleMouseDragging = true;
          middleMouseX = event.clientX;
          middleMouseY = event.clientY;
          spinEnabled = false;
          updateRotationButton();
          map.getCanvas().style.cursor = "grabbing";
        },
        true,
      );
      window.addEventListener("mousemove", (event) => {
        if (!middleMouseDragging) return;
        const dx = event.clientX - middleMouseX;
        const dy = event.clientY - middleMouseY;
        middleMouseX = event.clientX;
        middleMouseY = event.clientY;
        map.jumpTo({
          bearing: map.getBearing() + dx * 0.35,
          pitch: Math.min(75, Math.max(0, map.getPitch() - dy * 0.25)),
        });
      });
      window.addEventListener("mouseup", (event) => {
        if (event.button !== 1 || !middleMouseDragging) return;

      function createDetailsCard(details, isStory = false) {
        const card = document.createElement("article");
        card.className = "pin-details";
        const heading = document.createElement("h3");
        heading.textContent = details.title || details.name;
        card.appendChild(heading);

        const attributes = document.createElement("dl");
        const rows = [
          ["Date", details.date || "Not listed"],
          ["Creator", details.creator || "Not listed in the catalog"],
          ["Depicts", details.subject || details.location || "Not listed"],
        ];
        rows.forEach(([label, value]) => {
          const term = document.createElement("dt");
          term.textContent = label;
          const description = document.createElement("dd");
          description.textContent = value;
          attributes.append(term, description);
        });
        card.appendChild(attributes);

        const summary = document.createElement("p");
        summary.className = "map-description";
        summary.textContent =
          details.summary || "No summary was included in this catalog record.";
        card.appendChild(summary);

        if (details.imageUrl) {
          const imageLink = document.createElement("a");
          imageLink.href = details.imageUrl;
          imageLink.target = "_blank";
          imageLink.rel = "noopener";
          imageLink.title = "Open the full map image";
          const preview = document.createElement("img");
          preview.src = details.imageUrl;
          preview.alt = details.title || details.name;
          preview.loading = "lazy";
          imageLink.appendChild(preview);
          card.appendChild(imageLink);
          const previewNote = document.createElement("small");
          previewNote.className = "preview-note";
          previewNote.textContent =
            "Click the preview to open the full-resolution map.";
          card.appendChild(previewNote);
        }

        if (Array.isArray(details.relatedLinks) && details.relatedLinks.length) {
          const related = document.createElement("details");
          const relatedSummary = document.createElement("summary");
          relatedSummary.textContent = "View all eight sheet records";
          related.appendChild(relatedSummary);
          details.relatedLinks.forEach(([label, url]) => {
            const link = document.createElement("a");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = label + " ↗";
            related.appendChild(link);
          });
          card.appendChild(related);
        }

        if (Array.isArray(details.fullMetadata) && details.fullMetadata.length) {
          const catalogDetails = document.createElement("details");
          const catalogSummary = document.createElement("summary");
          catalogSummary.textContent = "Full David Rumsey catalog metadata";
          catalogDetails.appendChild(catalogSummary);
          const catalogList = document.createElement("dl");
          catalogList.className = "catalog-metadata";
          details.fullMetadata.forEach(({ label, values }) => {
            const term = document.createElement("dt");
            term.textContent = label;
            const description = document.createElement("dd");
            description.textContent = values.join("; ");
            catalogList.append(term, description);
          });
          catalogDetails.appendChild(catalogList);
          card.appendChild(catalogDetails);
        }

        const sourceUrl = isStory
          ? details.url
          : details.sourceUrl || details.url || details.kml;
        if (sourceUrl) {
          const link = document.createElement("a");
          link.href = sourceUrl;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = isStory ? "Open the full StoryMap ↗" : "View map record ↗";
          card.appendChild(link);
        }
        return card;
      }

      function condensedMapTitle(title, maximumLength = 34) {
        const cleanTitle = title
          .replace(/\s*\([^)]*\)\s*/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        if (cleanTitle.length <= maximumLength) return cleanTitle;
        const shortened = cleanTitle.slice(0, maximumLength - 1);
        const lastSpace = shortened.lastIndexOf(" ");
        return shortened.slice(0, Math.max(lastSpace, 18)) + "…";
      }

      function catalogPreviewUrl(entry) {
        if (entry.imageUrl) {
          return entry.imageUrl.replace(
            "/full/!1400,1400/",
            "/full/!240,160/",
          );
        }
        if (entry.previewUrl) return entry.previewUrl;
        const representativePreview = window.RUMSEY_PREVIEW_IMAGES?.[entry.id];
        if (representativePreview) return representativePreview;
        const overlays = Array.isArray(entry.overlays) ? entry.overlays : [];
        if (!overlays.length) return "";
        const [targetLongitude, targetLatitude] = entry.center;
        const nearestOverlay = overlays.reduce((nearest, overlay) => {
          const coordinates = Array.isArray(overlay.coordinates)
            ? overlay.coordinates
            : [];
          if (!coordinates.length) return nearest;
          const longitude =
            coordinates.reduce((sum, point) => sum + point[0], 0) /
            coordinates.length;
          const latitude =
            coordinates.reduce((sum, point) => sum + point[1], 0) /
            coordinates.length;
          const distance =
            (longitude - targetLongitude) ** 2 +
            (latitude - targetLatitude) ** 2;
          return !nearest || distance < nearest.distance
            ? { url: overlay.url, distance }
            : nearest;
        }, null);
        return nearestOverlay?.url || overlays[0].url;
      }

      const compassDial = document.getElementById("compass-dial");

      function updateCompassNode() {
        const bearing = map.getBearing();
        const angle = (-bearing * Math.PI) / 180;
        const center = compassDial.clientWidth / 2;
        const radius = center - 12;
        northNode.style.left = center + Math.sin(angle) * radius + "px";
        northNode.style.top = center - Math.cos(angle) * radius + "px";
        compassDial.dataset.bearing = String(Math.round(bearing));
      }

      function setBearingFromPointer(event) {
        const bounds = compassDial.getBoundingClientRect();
        const dx = event.clientX - (bounds.left + bounds.width / 2);
        const dy = event.clientY - (bounds.top + bounds.height / 2);
        const nodeAngle = (Math.atan2(dx, -dy) * 180) / Math.PI;
        map.setBearing(-nodeAngle);
      }

      northNode.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        compassDragging = true;
        spinEnabled = false;
        updateRotationButton();
        northNode.setPointerCapture(event.pointerId);
        setBearingFromPointer(event);
      });
      northNode.addEventListener("pointermove", (event) => {
        if (compassDragging) setBearingFromPointer(event);
      });
      northNode.addEventListener("pointerup", (event) => {
        compassDragging = false;
        northNode.releasePointerCapture(event.pointerId);
      });
      northNode.addEventListener("pointercancel", () => {
        compassDragging = false;
      });
      northNode.addEventListener("dblclick", (event) => {
        event.stopPropagation();
        map.easeTo({ bearing: 0, duration: 600 });
      });
      compassDial.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          const direction = event.key === "ArrowLeft" ? -1 : 1;
          map.easeTo({ bearing: map.getBearing() + direction * 5, duration: 100 });
        } else if (event.key === "Home") {
          event.preventDefault();
          map.easeTo({ bearing: 0, duration: 600 });
        }
      });

      function updateTiltHandle() {
        const pitch = Math.min(75, Math.max(0, map.getPitch()));
        const trackTop = 30;
        const trackBottom = tiltControl.clientHeight - 12;
        const top = trackBottom - (pitch / 75) * (trackBottom - trackTop);
        tiltHandle.style.top = top + "px";
        tiltControl.setAttribute("aria-valuenow", String(Math.round(pitch)));
      }

      function setPitchFromPointer(event) {
        const bounds = tiltControl.getBoundingClientRect();
        const trackTop = 30;
        const trackBottom = bounds.height - 12;
        const y = Math.min(
          trackBottom,
          Math.max(trackTop, event.clientY - bounds.top),
        );
        const pitch = ((trackBottom - y) / (trackBottom - trackTop)) * 75;
        map.setPitch(pitch);
      }

      tiltHandle.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        tiltDragging = true;
        spinEnabled = false;
        updateRotationButton();
        tiltHandle.setPointerCapture(event.pointerId);
        setPitchFromPointer(event);
      });
      tiltHandle.addEventListener("pointermove", (event) => {
        if (tiltDragging) setPitchFromPointer(event);
      });
      tiltHandle.addEventListener("pointerup", (event) => {

      tiltHandle.addEventListener("dblclick", (event) => {

        map.easeTo({ pitch: 0, duration: 600 });
      });
      tiltControl.addEventListener("click", (event) => {
        if (event.target !== tiltHandle) setPitchFromPointer(event);
      });

        if (event.key === "ArrowUp" || event.key === "ArrowDown") {

          );
          if (!entry) return;
          showStairwellMap(entry, feature.geometry.coordinates);
        });

        document.getElementById("historical-map-select").disabled = false;
      });

      // Add an event listener for the transparency slider.
      const slider = document.getElementById("slider");
      const sliderValue = document.getElementById("slider-value");
      const sliderLabelText = document.getElementById("slider-label-text");
      const historicalCredit = document.getElementById("historical-credit");
      let activeHistoricalLayers = ["historical-overlay"];
      let catalogOverlayLayerIds = [];
      let activeCatalogEntry = null;
      if (!historicalLayersEnabled) {
        document.querySelector(".map-overlay").hidden = true;
      }
      slider.addEventListener("input", (e) => {
        activeHistoricalLayers.forEach((layerId) => {
          if (map.getLayer(layerId)) {
            map.setPaintProperty(
              layerId,
              "raster-opacity",
              parseInt(e.target.value, 10) / 100,
            );
          }
        });
        sliderValue.textContent = e.target.value + "%"; // Value indicator
      });

      // The following values can be changed to control rotation speed:
      const secondsPerRevolution = 150;
      const maxSpinZoom = 5;
      const slowSpinZoom = 3;
      let spinEnabled = true;

      // Allow for Any Map Interaction
      let userInteracting = false;
      let isReturningToGlobe = false;
      const rotationButton = document.getElementById("toggle-rotation");

      function updateRotationButton() {
        rotationButton.textContent = spinEnabled
          ? "Pause rotation"
          : "Resume rotation";
        rotationButton.setAttribute("aria-pressed", String(!spinEnabled));
      }

      rotationButton.addEventListener("click", () => {
        spinEnabled = !spinEnabled;
        updateRotationButton();

        if (spinEnabled) {
          userInteracting = false;
          if (map.getZoom() > initialState.zoom + 0.1) {
            isReturningToGlobe = true;
            setTerrainEnabled(false);
            map.setProjection({ type: "globe" });
            map.flyTo({
              ...initialState,
              duration: 6000,
              essential: true,
            });
          } else {
            spinGlobe();
          }
        } else {
          isReturningToGlobe = false;
          map.stop();
        }
      });

      // Spinning the Globe
      function spinGlobe() {
        const zoom = map.getZoom();
        if (spinEnabled && !userInteracting && zoom < maxSpinZoom) {
          let distancePerSecond = 360 / secondsPerRevolution;
          if (zoom > slowSpinZoom) {
            const zoomDif = (maxSpinZoom - zoom) / (maxSpinZoom - slowSpinZoom);
            distancePerSecond *= zoomDif;
          }
          const center = map.getCenter();
          center.lng -= distancePerSecond;
          map.easeTo({ center, duration: 1000, easing: (n) => n });
        }
      }
      map.on("mousedown", () => {
        userInteracting = true;
      });
      map.on("dragstart", () => {
        spinEnabled = false;
        userInteracting = true;
        updateRotationButton();
      });
      map.on("mouseup", () => {
        userInteracting = false;
      });
      map.on("dragend", () => {
        userInteracting = false;
      });
      map.on("touchend", () => {
        userInteracting = false;
      });
      map.on("zoomstart", () => {
        if (isReturningToGlobe) return;
        spinEnabled = false;
        userInteracting = true;
        updateRotationButton();
      });
      map.on("zoomend", () => {
        userInteracting = false;
        isReturningToGlobe = false;
      });
      map.on("rotatestart", () => {
        if (isReturningToGlobe) return;
        spinEnabled = false;
        userInteracting = true;
        updateRotationButton();
      });
      map.on("rotateend", () => {
        userInteracting = false;
      });
      map.on("moveend", () => {
        spinGlobe();
      });
      spinGlobe();

      // Historical-map navigation buttons
      const SFcenter = {
        center: [-122.405, 37.796],
        zoom: 14.5,
        bearing: 0,
        pitch: 0,
      };
      const ChinatownCenter = {
        center: [-122.40632141485, 37.7941428737],
        zoom: 15.5,
        bearing: 0,
        pitch: 0,
      };
      const YosemiteCenter = {
        center: [-119.6188, 37.7355],
        zoom: 12,
        bearing: -25,
        pitch: 65,
      };

      function removeCatalogOverlayLayers() {
        catalogOverlayLayerIds.forEach((layerId) => {
          if (map.getLayer(layerId)) map.removeLayer(layerId);
          const sourceId = layerId + "-source";
          if (map.getSource(sourceId)) map.removeSource(sourceId);
        });
        catalogOverlayLayerIds = [];
      }

      function clearCatalogOverlays() {
        activeCatalogEntry = null;
        removeCatalogOverlayLayers();
      }

      function overlayIntersectsViewport(overlay) {
        const bounds = map.getBounds();
        if (!bounds) return true;
        const longitudes = overlay.coordinates.map(([longitude]) => longitude);
        const latitudes = overlay.coordinates.map(([, latitude]) => latitude);
        const overlayWest = Math.min(...longitudes);
        const overlayEast = Math.max(...longitudes);
        const overlaySouth = Math.min(...latitudes);
        const overlayNorth = Math.max(...latitudes);
        const viewWest = bounds.getWest();
        const viewEast = bounds.getEast();
        const viewSouth = bounds.getSouth();
        const viewNorth = bounds.getNorth();
        const longitudePadding = Math.min(30, Math.abs(viewEast - viewWest) * 0.3);
        const latitudePadding = Math.min(15, Math.abs(viewNorth - viewSouth) * 0.3);
        const latitudeVisible =
          overlayNorth >= viewSouth - latitudePadding &&
          overlaySouth <= viewNorth + latitudePadding;
        if (!latitudeVisible || Math.abs(viewEast - viewWest) >= 350) {
          return latitudeVisible;
        }
        if (viewWest <= viewEast) {
          return (
            overlayEast >= viewWest - longitudePadding &&
            overlayWest <= viewEast + longitudePadding
          );
        }
        return (
          overlayEast >= viewWest - longitudePadding ||
          overlayWest <= viewEast + longitudePadding
        );
      }

      function addCatalogRasterLayer(layerId, source) {
        map.addSource(layerId + "-source", source);
        map.addLayer(
          {
            id: layerId,
            type: "raster",
            source: layerId + "-source",
            paint: {
              "raster-opacity": parseInt(slider.value, 10) / 100,
              "raster-fade-duration": 0,
            },
          },
          map.getLayer("historical-map-pin-halos")
            ? "historical-map-pin-halos"
            : undefined,
        );
        catalogOverlayLayerIds.push(layerId);
        activeHistoricalLayers.push(layerId);
      }

      function overlayDistanceFromTarget(overlay, target) {
        const coordinates = Array.isArray(overlay.coordinates)
          ? overlay.coordinates
          : [];
        if (!coordinates.length) return Number.POSITIVE_INFINITY;
        const longitude =
          coordinates.reduce((sum, point) => sum + point[0], 0) /
          coordinates.length;
        const latitude =
          coordinates.reduce((sum, point) => sum + point[1], 0) /
          coordinates.length;
        return (longitude - target[0]) ** 2 + (latitude - target[1]) ** 2;
      }

      function renderCatalogOverlays(entry, initialRender = false) {
        if (activeCatalogEntry?.id !== entry.id) return;
        removeCatalogOverlayLayers();
        activeHistoricalLayers = [];

        if (entry.georeferencerTiles) {
          addCatalogRasterLayer("catalog-georeferencer", {
            type: "raster",
            tiles: [entry.georeferencerTiles],
            tileSize: 256,
            minzoom: entry.georeferencerMinZoom ?? 0,
            maxzoom: entry.georeferencerMaxZoom ?? 20,
            attribution: "David Rumsey Map Collection / Georeferencer",
          });
          return;
        }

        const useDetailLevel =
          Array.isArray(entry.detailOverlays) &&
          entry.detailOverlays.length > 0 &&
          map.getZoom() >= (entry.detailMinZoom ?? 8);
        const overlays = useDetailLevel
          ? entry.detailOverlays
          : Array.isArray(entry.overlays)
            ? entry.overlays
            : [];
        let visibleOverlays = overlays.map((overlay, index) => ({
          overlay,
          index,
        }));
        if (initialRender) {
          visibleOverlays.sort(
            (first, second) =>
              overlayDistanceFromTarget(first.overlay, entry.center) -
              overlayDistanceFromTarget(second.overlay, entry.center),
          );
          visibleOverlays = visibleOverlays.slice(0, 36);
        } else {
          visibleOverlays = visibleOverlays.filter(({ overlay }) =>
            overlayIntersectsViewport(overlay),
          );
          if (visibleOverlays.length > 96) {
            const viewportCenter = map.getCenter();
            visibleOverlays.sort(
              (first, second) =>
                overlayDistanceFromTarget(first.overlay, [
                  viewportCenter.lng,
                  viewportCenter.lat,
                ]) -
                overlayDistanceFromTarget(second.overlay, [
                  viewportCenter.lng,
                  viewportCenter.lat,
                ]),
            );
            visibleOverlays = visibleOverlays.slice(0, 96);
          }
        }
        if (!visibleOverlays.length && overlays.length) {
          visibleOverlays = overlays
            .map((overlay, index) => ({ overlay, index }))
            .sort(
              (first, second) =>
                overlayDistanceFromTarget(first.overlay, entry.center) -
                overlayDistanceFromTarget(second.overlay, entry.center),
            )
            .slice(0, 4);
        }
        visibleOverlays.forEach(({ overlay, index }) => {
          addCatalogRasterLayer("catalog-overlay-" + index, {
            type: "image",
            url: overlay.url,
            coordinates: overlay.coordinates,
          });
        });
      }

      const clearMapButton = document.getElementById("clear-map");

      function clearDisplayedMap() {
        detailsPopup.remove();
        clearCatalogOverlays();
        ["historical-overlay", "chinatown-overlay", "yosemite-overlay"].forEach(
          (id) => {
            if (map.getLayer(id)) {
              map.setLayoutProperty(id, "visibility", "none");
            }
          },
        );
        activeHistoricalLayers = [];
        resetHistoricalPicker();
        resetStairwellPicker();
        storyMapSelect.selectedIndex = 0;
        document.querySelector(".map-overlay").hidden = true;
        document.querySelector(".map-overlay-inner").style.borderLeft = "";
        clearMapButton.hidden = true;
      }

      clearMapButton.addEventListener("click", clearDisplayedMap);

      function showHistoricalMap(
        layerId,
        label,
        creditHtml,
        target,
        useTerrain = false,
      ) {
        document.querySelector(".map-overlay").hidden = false;
        clearMapButton.hidden = false;
        document.querySelector(".map-overlay-inner").style.borderLeft = "";
        slider.disabled = false;
        slider.style.display = "";
        sliderValue.hidden = false;
        resetStairwellPicker();
        storyMapSelect.selectedIndex = 0;
        clearCatalogOverlays();
        spinEnabled = false;
        userInteracting = false;
        isReturningToGlobe = false;
        updateRotationButton();
        map.stop();
        ["historical-overlay", "chinatown-overlay", "yosemite-overlay"].forEach(
          (id) => map.setLayoutProperty(id, "visibility", "none"),
        );
        setTerrainEnabled(false);
        map.setProjection({ type: useTerrain ? "globe" : "mercator" });
        activeHistoricalLayers = [layerId];
        sliderLabelText.textContent = label + " opacity";
        historicalCredit.innerHTML = creditHtml;
        map.setPaintProperty(
          layerId,
          "raster-opacity",
          parseInt(slider.value, 10) / 100,
        );

        if (useTerrain) {
          // Avoid downloading large historical and elevation tiles throughout
          // a globe-to-Yosemite animation. Move first, then add terrain and
          // reveal the historical overlay once the new frame is ready.
          map.jumpTo(target);
          window.requestAnimationFrame(() => {
            if (activeHistoricalLayers.includes(layerId)) {
              setTerrainEnabled(true);
              window.setTimeout(() => {
                if (activeHistoricalLayers.includes(layerId)) {
                  map.setLayoutProperty(layerId, "visibility", "visible");
                }
              }, 400);
            }
          });
          return;
        }

        map.setLayoutProperty(layerId, "visibility", "visible");
        map.flyTo({
          ...target,
          duration: 6000,
          essential: true,
        });
      }

      function showCatalogMap(entry) {
        document.querySelector(".map-overlay").hidden = false;
        document.querySelector(".map-overlay-inner").style.borderLeft = "";
        resetStairwellPicker();
        storyMapSelect.selectedIndex = 0;
        clearCatalogOverlays();
        const overlays = Array.isArray(entry.overlays) ? entry.overlays : [];
        const hasOfficialTiles = Boolean(entry.georeferencerTiles);
        const hasMap = hasOfficialTiles || overlays.length > 0;
        clearMapButton.hidden = !hasMap;
        slider.disabled = !hasMap;
        slider.style.display = hasMap ? "" : "none";
        sliderValue.hidden = !hasMap;
        sliderLabelText.textContent =
          entry.name + (hasMap ? " opacity" : "");
        const officialRecordUrl =
          entry.georeferencerUrl || entry.sourceUrl ||
          "https://www.davidrumsey.com/view/georeferencer";
        historicalCredit.innerHTML =
          '<a href="' +
          officialRecordUrl.replaceAll('"', "&quot;") +
          '" target="_blank" rel="noopener">' +
          (hasOfficialTiles
            ? "Official David Rumsey Georeferencer tiles"
            : "David Rumsey record · cached georeference fallback") +
          "</a>";
        spinEnabled = false;
        userInteracting = false;
        isReturningToGlobe = false;
        updateRotationButton();
        map.stop();
        ["historical-overlay", "chinatown-overlay", "yosemite-overlay"].forEach(
          (id) => map.setLayoutProperty(id, "visibility", "none"),
        );
        setTerrainEnabled(false);
        map.setProjection({ type: "globe" });
        activeCatalogEntry = entry;
        if (hasMap) renderCatalogOverlays(entry, true);
        showDetailsPopup(entry, entry.center);
        map.flyTo({
          center: entry.center,
          zoom: entry.zoom,
          bearing: 0,
          pitch: 0,
          duration: 4500,
          essential: true,
        });
      }

      map.on("moveend", () => {
        if (activeCatalogEntry && !activeCatalogEntry.georeferencerTiles) {
          renderCatalogOverlays(activeCatalogEntry);
        }
      });

      function showStoryLocation(story) {
        resetHistoricalPicker();
        resetStairwellPicker();
        clearCatalogOverlays();
        ["historical-overlay", "chinatown-overlay", "yosemite-overlay"].forEach(
          (id) => map.setLayoutProperty(id, "visibility", "none"),
        );
        activeHistoricalLayers = [];
        clearMapButton.hidden = true;
        document.querySelector(".map-overlay").hidden = false;
        document.querySelector(".map-overlay-inner").style.borderLeft =
          "6px solid #6f42c1";
        slider.disabled = true;
        slider.style.display = "none";
        sliderValue.hidden = true;
        sliderLabelText.textContent = story.title + " — " + story.location;
        historicalCredit.innerHTML =
          '<a href="' +
          story.url.replaceAll('"', "&quot;") +
          '" target="_blank" rel="noopener">Open ArcGIS StoryMap</a>';
        spinEnabled = false;
        userInteracting = false;
        isReturningToGlobe = false;
        updateRotationButton();
        map.stop();
        setTerrainEnabled(false);
        map.setProjection({ type: "globe" });
        map.flyTo({
          center: story.center,
          zoom: story.zoom,
          bearing: 0,
          pitch: 25,
          duration: 4500,
          essential: true,
        });
      }

      function showStairwellMap(entry, popupCoordinates = entry.center) {
        stairwellMapSelect.value = entry.id;
        stairwellMapSummary.textContent = condensedMapTitle(entry.title, 30);
        stairwellMapPicker.open = false;
        resetHistoricalPicker();
        storyMapSelect.selectedIndex = 0;
        clearCatalogOverlays();
        ["historical-overlay", "chinatown-overlay", "yosemite-overlay"].forEach(
          (id) => map.setLayoutProperty(id, "visibility", "none"),
        );
        activeHistoricalLayers = [];
        clearMapButton.hidden = true;
        document.querySelector(".map-overlay").hidden = false;
        document.querySelector(".map-overlay-inner").style.borderLeft =
          "6px solid #008c95";
        slider.disabled = true;
        slider.style.display = "none";
        sliderValue.hidden = true;
        sliderLabelText.textContent = entry.title;
        historicalCredit.innerHTML =
          '<a href="' +
          entry.url.replaceAll('"', "&quot;") +
          '" target="_blank" rel="noopener">Open David Rumsey record</a>';
        spinEnabled = false;
        userInteracting = false;
        isReturningToGlobe = false;
        updateRotationButton();
        map.stop();
        setTerrainEnabled(false);
        map.setProjection({ type: "globe" });
        showDetailsPopup(entry, popupCoordinates);
        map.flyTo({
          center: entry.center,
          zoom: entry.zoom,
          bearing: 0,
          pitch: 20,
          duration: 4500,
          essential: true,
        });
      }

      historicalMapSelect.addEventListener("change", (event) => {
        const selectedEntry =
          featuredMaps.find((entry) => entry.id === event.target.value) ||
          rumseyCatalog.find((entry) => entry.id === event.target.value);
        if (selectedEntry) {
          historicalMapSummary.textContent = condensedMapTitle(
            selectedEntry.title || selectedEntry.name,
            30,
          );
          historicalMapPicker.open = false;
        }
        if (event.target.value === "sf1853") {
            showHistoricalMap(
              "historical-overlay",
              "1853 map",
              '<a href="https://www.davidrumsey.com/luna/servlet/detail/RUMSEY~8~1~2210~180022" target="_blank" rel="noopener">David Rumsey Map Collection</a>',
              SFcenter,
            );
            showDetailsPopup(featuredMapDetails.sf1853, SFcenter.center);
        } else if (event.target.value === "chinatown1929") {
            showHistoricalMap(
              "chinatown-overlay",
              "1929 Chinatown map",
              '<a href="https://purl.stanford.edu/pt740jp0404" target="_blank" rel="noopener">Stanford Libraries / J. P. Wong</a>',
              ChinatownCenter,
            );
            showDetailsPopup(
              featuredMapDetails.chinatown1929,
              ChinatownCenter.center,
            );
        } else if (event.target.value === "yosemite1883") {
            showHistoricalMap(
              "yosemite-overlay",
              "1883 Yosemite map",
              '<a href="https://www.davidrumsey.com/luna/servlet/detail/RUMSEY~8~1~405~40014" target="_blank" rel="noopener">David Rumsey Map Collection</a>',
              YosemiteCenter,
              true,
            );
            showDetailsPopup(
              featuredMapDetails.yosemite1883,
              YosemiteCenter.center,
            );
        } else {
          const catalogEntry = rumseyCatalog.find(
            (entry) => entry.id === event.target.value,
          );
          if (catalogEntry) showCatalogMap(catalogEntry);
        }
      });
      storyMapSelect.addEventListener("change", (event) => {
        const story = storyLocations.find(
          (entry) => entry.id === event.target.value,
        );
        if (story) showStoryLocation(story);
      });
      stairwellMapSelect.addEventListener("change", (event) => {
        const entry = stairwellMaps.find(
          (item) => item.id === event.target.value,
        );
        if (entry) showStairwellMap(entry);
      });
    </script>
  </body>
</html>
